<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
<title id="title">RecallFlow — demo events</title>
<desc id="desc">Three aggregate workflow rates. N/A indicates no measurable denominator. Source opened is a navigation handoff, not reading. Historical uninstrumented requests cannot be reconstructed.</desc>
<rect width="1040" height="430" fill="#f5f7fb"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="32" y="42" font-size="25" font-weight="700">RecallFlow — demo events</text>
<text x="32" y="70" font-size="13">2026-10-26T00:00:00Z ≤ time &lt; 2026-10-27T00:00:00Z</text>
<text x="32" y="115" font-size="17">Save-operation success rate</text>
<rect x="330" y="95" width="480" height="28" rx="6" fill="#dbe3ee"/>
<rect x="330" y="95" width="400.00" height="28" rx="6" fill="#2765cc"/>
<text x="830" y="115" font-size="17">83.3% (5/6)</text>
<text x="32" y="195" font-size="17">Due-card action rate</text>
<rect x="330" y="175" width="480" height="28" rx="6" fill="#dbe3ee"/>
<rect x="330" y="175" width="480.00" height="28" rx="6" fill="#2765cc"/>
<text x="830" y="195" font-size="17">100.0% (3/3)</text>
<text x="32" y="275" font-size="17">Open-handoff success rate</text>
<rect x="330" y="255" width="480" height="28" rx="6" fill="#dbe3ee"/>
<rect x="330" y="255" width="240.00" height="28" rx="6" fill="#2765cc"/>
<text x="830" y="275" font-size="17">50.0% (1/2)</text>
<text x="32" y="360" font-size="14">N/A = no measurable denominator. Historical uninstrumented requests cannot be reconstructed.</text>
<text x="32" y="385" font-size="14">Handoff ≠ reading. Demo events ≠ user validation. See the report for definitions and limitations.</text>
</g></svg>
